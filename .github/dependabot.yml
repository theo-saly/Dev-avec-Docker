version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10

    - package-ecosystem: "composer"
      directory: "/services/auth-service"
      schedule:
          interval: "weekly"

    - package-ecosystem: "docker"
      directory: "/services"
      schedule:
          interval: "weekly"

    - package-ecosystem: "docker"
      directory: "/frontend"
      schedule:
          interval: "weekly"

    - package-ecosystem: "docker"
      directory: "/reverse-proxy"
      schedule:
          interval: "weekly"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
