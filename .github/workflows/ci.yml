name: CI

on:
    push:
        branches: ['**']
        tags: ['v*']

env:
    REGISTRY: ghcr.io

jobs:
    test-node:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                service: [event-service, ticket-service, notification-service]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            # Monorepo en workspaces : les dépendances s'installent depuis la racine.
            - run: npm ci
            - run: npm run lint
              working-directory: services/${{ matrix.service }}
            - run: npm test -- --coverage
              working-directory: services/${{ matrix.service }}

    test-php:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/auth-service
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
            - run: composer install --no-interaction --prefer-dist
            - run: vendor/bin/phpunit

    build-push:
        needs: [test-node, test-php]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: true
            matrix:
                include:
                    - service: auth-service
                      context: services/auth-service
                      file: services/auth-service/Dockerfile
                      port: 3001
                    - service: event-service
                      context: .
                      file: services/event-service/Dockerfile
                      port: 3002
                    - service: ticket-service
                      context: .
                      file: services/ticket-service/Dockerfile
                      port: 3003
                    - service: notification-service
                      context: .
                      file: services/notification-service/Dockerfile
                      port: 3004
                    - service: reverse-proxy
                      context: reverse-proxy
                      file: reverse-proxy/Dockerfile
                      port: 8080
                    - service: frontend
                      context: frontend
                      file: frontend/Dockerfile
                      port: 80
        steps:
            - uses: actions/checkout@v4
            # Les noms d'image Docker doivent être en minuscules.
            - name: Nom de l'image
              run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=sha,format=long
                      type=ref,event=tag
            # Build local (load: true) : rien n'est poussé avant le scan Trivy.
            - uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  build-args: |
                      VERSION=${{ steps.meta.outputs.version }}
                  load: true
                  tags: ${{ steps.meta.outputs.tags }}
            # Figée sur le SHA du commit (v0.36.0) : un tag peut être déplacé, pas un SHA
            - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
                  severity: CRITICAL
                  exit-code: '1'
            - run: docker push --all-tags ${{ env.IMAGE }}
