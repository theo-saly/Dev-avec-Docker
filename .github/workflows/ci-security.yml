name: Security

on:
    push:
        branches: ['**']

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    npm-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - name: npm audit (bloquant sur critical)
              run: npm audit --audit-level=critical

    compose-config:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: docker compose --env-file env/test.env --env-file .env.example config --quiet
