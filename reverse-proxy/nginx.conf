server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Docker embedded DNS to resolve service names at runtime.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward static frontend to the frontend container.
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward auth API calls to the auth service container.
    location = /api/auth {
        return 301 /api/auth/;
    }

    location ^~ /api/auth/ {
        set $auth_upstream http://auth-service:3001;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La disponibilité d'un événement est calculée par le ticket-service
    # (route plus spécifique que /api/events, donc prioritaire).
    location ~ ^/api/events/[^/]+/availability$ {
        set $ticket_upstream http://ticket-service:3003;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $ticket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward event API calls to the event service container.
    location /api/events {
        set $event_upstream http://event-service:3002;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $event_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward ticket API calls to the ticket service container.
    location /api/tickets {
        set $ticket_upstream http://ticket-service:3003;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $ticket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # notification-service n'a aucune route publique : il n'est pas exposé.
}
